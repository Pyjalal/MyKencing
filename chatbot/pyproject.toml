[project]
name = "mymedix-chatbot"
version = "2.0.0"
description = "Dhia: retrieval-augmented health assistant for MyKencing"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langgraph>=0.2",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
ingest = ["pymupdf4llm>=0.0.17", "langchain-text-splitters>=0.3", "curl_cffi>=0.7", "pyyaml>=6", "python-dotenv>=1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]
eval = ["ragas>=0.2", "datasets>=3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
