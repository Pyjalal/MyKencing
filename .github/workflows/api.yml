name: API CI

on:
  push:
    branches: [ master, main ]
    paths: [ 'api/**', '.github/workflows/api.yml' ]
  pull_request:
    paths: [ 'api/**', '.github/workflows/api.yml' ]
  workflow_dispatch:

defaults:
  run:
    working-directory: api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm run build

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency: fly-deploy
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only

      - name: Skip deploy (no FLY_API_TOKEN secret)
        if: env.FLY_API_TOKEN == ''
        run: echo "::warning::FLY_API_TOKEN is not set; skipping deploy"
