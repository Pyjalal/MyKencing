name: Android CI

on:
  push:
    branches: [ master, main ]
    paths-ignore: [ 'api/**', '.github/workflows/api.yml' ]
  pull_request:
    paths-ignore: [ 'api/**', '.github/workflows/api.yml' ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          # Remove unnecessary tools and files to free up space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/25.*
          sudo rm -rf /usr/local/lib/android/sdk/ndk/26.*
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install JS deps (if needed)
        run: |
          if [ -f package.json ]; then npm install --legacy-peer-deps; fi
          npm cache clean --force
          df -h

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Decode Keystore
        run: |
          # Remove any whitespace/newlines from base64 string and decode
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 -d > android/app/mykencing-release.keystore

          # Verify keystore was created
          ls -lh android/app/mykencing-release.keystore
          echo "Keystore file size: $(stat -c%s android/app/mykencing-release.keystore) bytes"

      - name: Configure Gradle settings and signing
        working-directory: android
        run: |
          # Performance settings for CI
          echo "# Limit ABIs to save disk space in CI" >> gradle.properties
          echo "reactNativeArchitectures=arm64-v8a,armeabi-v7a" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dkeystore.pkcs12.legacy=true" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties

          # Release signing configuration
          echo "" >> gradle.properties
          echo "# Release signing configuration" >> gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=mykencing-release.keystore" >> gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> gradle.properties

      - name: Setup signing configuration
        run: |
          # Copy signing configuration file
          cp android-signing.gradle android/app/

          # Apply signing configuration to build.gradle
          echo "" >> android/app/build.gradle
          echo "// Apply release signing configuration" >> android/app/build.gradle
          echo "apply from: './android-signing.gradle'" >> android/app/build.gradle

      - name: Grant gradlew execute
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
